site:
  name: Vishal Dhatrika's Portfolio
  site: 'https://vishaldhatrika.me'
  base: '/'
  trailingSlash: false


# Default SEO metadata
metadata:
  title:
    default: Vishal Dhatrika's Portfolio
    template: '%s — VD'
  description: "Welcome to Vishal Dhatrika's Portfolio - Showcasing my projects, skills, and experiences in web development and design."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Vishal Dhatrika's Portfolio
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@vishaldhatrika'
    site: '@vishaldhatrika'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: "G-KLR48Z7D5K"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
